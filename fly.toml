app="selectify-platform"
primary_region="iad"

[build]

[env]
  PORT="3000"
  DATABASE_URL="file:/data/sqlite.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "selectify_db_data"
  destination = "/data"
